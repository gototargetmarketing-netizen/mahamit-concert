<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10271d">
    <meta name="robots" content="noindex">
    <title>บัตรเข้างาน | MAHAMIT CONCERT #2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- QR Code Generator (MIT) สร้าง QR ในมือถือเอง ไม่ต้องเรียก Apps Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --green: #10271d;
            --green-ok: #176b4d;
            --burgundy: #a3262a;
            --gold: #d9b85c;
            --gold-dark: #b08b38;
            --cream: #f4f2ec;
            --card: #f8f4ea;
            --line: #eee5d3;
            --text: #18271e;
            --muted: #68716c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: "Kanit", Arial, sans-serif;
        }
        header {
            background-color: var(--green);
            background: linear-gradient(135deg, #10271d 0%, #1b382a 55%, #0c2118 100%);
            color: #fff;
            text-align: center;
            padding: 28px 16px 24px;
        }
        .brand { font-size: 12px; letter-spacing: 5px; font-weight: 600; color: var(--gold); }
        .title { font-size: 26px; font-weight: 800; letter-spacing: 2px; margin-top: 6px; }
        .event { font-size: 13px; color: #e4d49c; margin-top: 8px; }
        main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
        .summary {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .label { font-size: 12px; color: var(--muted); }
        .value { font-size: 17px; font-weight: 600; word-break: break-all; }
        .summary .row + .row { margin-top: 10px; }
        .tip {
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
            text-align: center;
            margin: 0 0 16px;
        }
        .ticket {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 20px 16px 18px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .05);
        }
        .seat { font-size: 30px; font-weight: 800; line-height: 1.1; }
        .zone {
            display: inline-block;
            margin: 8px 0 12px;
            padding: 3px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .zone-A { background: var(--burgundy); }
        .zone-B { background: var(--green-ok); }
        .holder { font-size: 20px; font-weight: 600; margin: -4px 0 12px; word-break: break-word; }
        .qr { width: min(78vw, 300px); margin: 0 auto; background: #fff; }
        .qr svg { display: block; width: 100%; height: auto; }
        .share {
            margin-top: 14px;
            border: 1px solid var(--green-ok);
            background: #fff;
            color: var(--green-ok);
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
        }
        .share:active { background: #dff3e8; }
        .error {
            background: #fbe9e9;
            border-left: 4px solid var(--burgundy);
            border-radius: 0 12px 12px 0;
            padding: 16px 18px;
            line-height: 1.7;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: var(--green);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        footer { text-align: center; font-size: 11px; letter-spacing: 3px; color: var(--muted); padding-bottom: 24px; }
    </style>
</head>
<body>
    <header>
        <div class="brand">MAHAMIT</div>
        <div class="title">CONCERT #2</div>
        <div class="event">มิตรภาพไม่มีวันดึกดำบรรพ์ · 16 ม.ค. 2570 · เกรียงไกรมาหามิตร (KK market)</div>
    </header>

    <main id="app"></main>
    <div class="toast" id="toast"></div>
    <footer>MUSIC • FRIENDSHIP • FOREVER</footer>

    <script>
        // ต้องตรงกับ QR_PREFIX ใน code.gs (หน้าสแกนอ่านรูปแบบ MK2|เลขอ้างอิง|ที่นั่ง|รหัสลับ)
        const QR_PREFIX = 'MK2';
        // โซนตามแถว ต้องตรงกับ ROW_CONFIG ใน index.html
        const ZONE_A_ROWS = 'ABCDEFG';

        function esc(value) {
            return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ลิงก์จากอีเมล: ticket.html#r=เลขอ้างอิง&n=ชื่อผู้จอง&s=A01.รหัสลับ,A02.รหัสลับ&a=ชื่อผู้นั่ง A01,ชื่อผู้นั่ง A02
        // (a เรียงตามลำดับเดียวกับ s ลิงก์เก่าที่ไม่มี a ยังเปิดได้ แค่ไม่แสดงชื่อผู้นั่ง)
        function readTicketData() {
            const params = new URLSearchParams(location.hash.slice(1));
            const orderRef = (params.get('r') || '').trim();
            const name = (params.get('n') || '').trim();
            const holders = (params.get('a') || '').split(',');
            const seats = (params.get('s') || '').split(',').map((item, i) => {
                const [seat, token] = item.split('.');
                return { seat, token, holder: (holders[i] || '').trim() };
            }).filter(t => /^[A-Z]\d{2}$/.test(t.seat || '') && /^[A-Za-z0-9_-]{16}$/.test(t.token || ''));
            return { orderRef, name, seats };
        }

        function qrSvg(text) {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            return qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
        }

        // ลิงก์สำหรับส่ง QR ที่นั่งเดียวให้เพื่อน
        function seatLink(data, ticket) {
            return location.origin + location.pathname +
                '#r=' + encodeURIComponent(data.orderRef) +
                '&n=' + encodeURIComponent(data.name) +
                '&s=' + ticket.seat + '.' + ticket.token +
                '&a=' + encodeURIComponent(ticket.holder || '');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        async function shareSeat(index) {
            const ticket = ticketData.seats[index];
            const url = seatLink(ticketData, ticket);
            const text = `บัตรเข้างาน MAHAMIT CONCERT #2 ที่นั่ง ${ticket.seat}` + (ticket.holder ? ` (${ticket.holder})` : '');
            try {
                if (navigator.share) {
                    await navigator.share({ title: text, text: text, url: url });
                    return;
                }
                await navigator.clipboard.writeText(url);
                showToast('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย');
            } catch (err) {
                // ผู้ใช้กดยกเลิกการแชร์ ไม่ต้องแจ้งอะไร
                if (err && err.name === 'AbortError') return;
                prompt('คัดลอกลิงก์นี้ส่งให้เพื่อน', url);
            }
        }

        function render(data) {
            const app = document.getElementById('app');
            if (!data.orderRef || !data.seats.length) {
                app.innerHTML = `<div class="error"><b>ไม่พบข้อมูลบัตรเข้างาน</b><br>
                    กรุณาเปิดลิงก์จากอีเมลยืนยันการจองอีกครั้ง หรือติดต่อผู้จัดงานพร้อมเลขอ้างอิงการจอง</div>`;
                return;
            }
            if (typeof qrcode !== 'function') {
                app.innerHTML = `<div class="error"><b>โหลดตัวสร้าง QR ไม่สำเร็จ</b><br>
                    กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้ หรือใช้ QR ในอีเมลแทน</div>`;
                return;
            }

            const summary = `
                <div class="summary">
                    ${data.name ? `<div class="row"><div class="label">ชื่อผู้จอง</div><div class="value">${esc(data.name)}</div></div>` : ''}
                    <div class="row"><div class="label">เลขอ้างอิงการจอง</div><div class="value">${esc(data.orderRef)}</div></div>
                    <div class="row"><div class="label">จำนวน</div><div class="value">${data.seats.length} ที่นั่ง</div></div>
                </div>
                <p class="tip">แสดง QR ที่จุดลงทะเบียนเพื่อรับริสแบนด์<br>1 QR ต่อ 1 ที่นั่ง · กรุณาเพิ่มความสว่างหน้าจอ</p>`;

            const tickets = data.seats.map((t, i) => {
                const zone = ZONE_A_ROWS.includes(t.seat.charAt(0)) ? 'A' : 'B';
                const payload = [QR_PREFIX, data.orderRef, t.seat, t.token].join('|');
                return `
                    <section class="ticket">
                        <div class="seat">ที่นั่ง ${esc(t.seat)}</div>
                        <div class="zone zone-${zone}">โซน ${zone}</div>
                        ${t.holder ? `<div class="holder">${esc(t.holder)}</div>` : ''}
                        <div class="qr" aria-label="QR ที่นั่ง ${esc(t.seat)}">${qrSvg(payload)}</div>
                        ${data.seats.length > 1 ? `<button class="share" type="button" onclick="shareSeat(${i})">แชร์ที่นั่งนี้ให้เพื่อน</button>` : ''}
                    </section>`;
            }).join('');

            app.innerHTML = summary + tickets;
        }

        let ticketData = readTicketData();
        render(ticketData);
        window.addEventListener('hashchange', () => {
            ticketData = readTicketData();
            render(ticketData);
        });
    </script>
</body>
</html>
